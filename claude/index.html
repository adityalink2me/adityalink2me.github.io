<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Claude Operator's Course — From Chatting to Running It</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0e13;
    --panel: #10161e;
    --panel-2: #141b24;
    --line: rgba(107,197,224,0.14);
    --line-strong: rgba(107,197,224,0.28);
    --cyan: #5ec8e0;
    --cyan-dim: #3a8ea3;
    --amber: #e8432e;
    --amber-dim: #7a2a20;
    --text: #e9edf1;
    --text-mute: #8b98a5;
    --text-faint: #56626d;
    --done: #58d68d;
    --radius: 2px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:
      linear-gradient(var(--line) 1px, transparent 1px) 0 0/40px 40px,
      linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0/40px 40px,
      var(--bg);
    color:var(--text);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--amber); color:#0a0e13; }
  .mono{ font-family:'IBM Plex Mono', monospace; }
  .disp{ font-family:'Oswald', sans-serif; text-transform:uppercase; letter-spacing:0.02em; }

  a{ color:var(--cyan); }

  /* ---------- Shell layout ---------- */
  .shell{ display:flex; min-height:100vh; }

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:340px; flex-shrink:0;
    background:linear-gradient(180deg, var(--panel) 0%, #0c1117 100%);
    border-right:1px solid var(--line-strong);
    display:flex; flex-direction:column;
    position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .sidebar::-webkit-scrollbar{ width:6px; }
  .sidebar::-webkit-scrollbar-thumb{ background:var(--cyan-dim); }

  .brand{
    padding:26px 24px 18px; border-bottom:1px solid var(--line);
  }
  .brand .eyebrow{
    font-size:11px; letter-spacing:0.18em; color:var(--amber); font-family:'IBM Plex Mono',monospace;
    display:flex; align-items:center; gap:8px; margin-bottom:8px;
  }
  .brand .eyebrow::before{ content:''; width:6px; height:6px; background:var(--amber); border-radius:50%; box-shadow:0 0 8px var(--amber); }
  .brand h1{
    font-family:'Oswald',sans-serif; font-size:26px; font-weight:700; text-transform:uppercase;
    line-height:1.05; letter-spacing:0.01em;
  }
  .brand p{ color:var(--text-mute); font-size:13px; margin-top:8px; line-height:1.5; }

  /* Gauge cluster */
  .gauge-wrap{
    padding:22px 24px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:18px;
  }
  .gauge{ position:relative; width:104px; height:104px; flex-shrink:0; }
  .gauge svg{ transform:rotate(-90deg); }
  .gauge-track{ fill:none; stroke:#1b2530; stroke-width:8; }
  .gauge-fill{ fill:none; stroke:var(--cyan); stroke-width:8; stroke-linecap:round;
    transition:stroke-dashoffset .6s cubic-bezier(.65,0,.35,1), stroke .3s; filter:drop-shadow(0 0 5px rgba(94,200,224,.6)); }
  .gauge-redline{ fill:none; stroke:var(--amber); stroke-width:8; opacity:.55; }
  .gauge-center{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .gauge-num{ font-family:'IBM Plex Mono',monospace; font-size:22px; font-weight:600; color:var(--text); }
  .gauge-lbl{ font-size:9px; letter-spacing:.12em; color:var(--text-faint); text-transform:uppercase; margin-top:1px;}
  .gauge-meta{ font-size:12px; color:var(--text-mute); line-height:1.7; }
  .gauge-meta b{ color:var(--text); font-family:'IBM Plex Mono',monospace; font-weight:600;}

  /* Lesson list */
  .lesson-nav{ padding:14px 12px 30px; flex:1; }
  .nav-section-lbl{
    font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.16em; color:var(--text-faint);
    padding:10px 12px 8px; text-transform:uppercase;
  }
  .lesson-item{
    display:flex; align-items:center; gap:12px;
    padding:10px 12px; border-radius:var(--radius); cursor:pointer;
    border-left:2px solid transparent;
    transition:background .15s, border-color .15s;
  }
  .lesson-item:hover{ background:rgba(94,200,224,0.06); }
  .lesson-item.active{ background:rgba(94,200,224,0.1); border-left-color:var(--cyan); }
  .lesson-num{
    font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--text-faint);
    width:24px; flex-shrink:0; text-align:right;
  }
  .lesson-item.active .lesson-num{ color:var(--cyan); }
  .lesson-check{
    width:16px; height:16px; border:1.5px solid var(--text-faint); border-radius:3px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; transition:all .15s;
  }
  .lesson-check.checked{ background:var(--done); border-color:var(--done); }
  .lesson-check.checked::after{ content:'✓'; font-size:11px; color:#0a0e13; font-weight:700; }
  .lesson-info{ flex:1; min-width:0; }
  .lesson-title{ font-size:13.5px; font-weight:600; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .lesson-item.active .lesson-title{ color:var(--cyan); }
  .lesson-time{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--text-faint); }

  /* ---------- Main ---------- */
  .main{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .topbar{
    position:sticky; top:0; z-index:5;
    background:rgba(10,14,19,0.88); backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line-strong);
    padding:16px 44px; display:flex; align-items:center; justify-content:space-between; gap:20px;
  }
  .topbar .path{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--text-mute); }
  .topbar .path b{ color:var(--cyan); }
  .topbar .actions{ display:flex; gap:10px; }
  .btn{
    font-family:'IBM Plex Mono',monospace; font-size:12px; padding:8px 16px; border-radius:2px;
    border:1px solid var(--line-strong); background:transparent; color:var(--text-mute); cursor:pointer;
    transition:all .15s; letter-spacing:.02em; white-space:nowrap;
  }
  .btn:hover{ border-color:var(--cyan); color:var(--cyan); }
  .btn.primary{ background:var(--cyan); border-color:var(--cyan); color:#06131a; font-weight:600; }
  .btn.primary:hover{ background:#7ad4e8; color:#06131a; }
  .btn.done-state{ background:var(--done); border-color:var(--done); color:#06131a; }

  .content{ flex:1; padding:48px 44px 100px; max-width:900px; }

  .lesson-header{ margin-bottom:34px; }
  .lesson-header .tag{
    font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--amber); letter-spacing:.14em;
    display:flex; align-items:center; gap:10px; margin-bottom:14px;
  }
  .lesson-header .tag .num{ font-size:34px; color:var(--line-strong); font-weight:600; line-height:1; }
  .lesson-header h2{
    font-family:'Oswald',sans-serif; font-size:40px; font-weight:700; text-transform:uppercase; line-height:1.05;
  }
  .lesson-header .sub{ color:var(--text-mute); font-size:16px; margin-top:10px; max-width:640px; line-height:1.5;}
  .lesson-header .meta-row{ display:flex; gap:22px; margin-top:18px; }
  .meta-chip{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--text-mute); display:flex; align-items:center; gap:6px;}
  .meta-chip .dot{ width:5px; height:5px; background:var(--cyan); border-radius:50%; }

  .block{ margin-bottom:30px; }
  .block h3{
    font-family:'Oswald',sans-serif; font-size:15px; text-transform:uppercase; letter-spacing:.08em;
    color:var(--cyan); margin-bottom:14px; display:flex; align-items:center; gap:10px;
  }
  .block h3::after{ content:''; flex:1; height:1px; background:var(--line-strong); }
  .block p{ font-size:15px; line-height:1.75; color:#c9d1d9; margin-bottom:12px; }
  .block ul{ list-style:none; }
  .block ul li{
    font-size:14.5px; line-height:1.7; color:#c9d1d9; padding:8px 0 8px 22px; position:relative;
    border-bottom:1px solid var(--line);
  }
  .block ul li:last-child{ border-bottom:none; }
  .block ul li::before{ content:'—'; position:absolute; left:0; color:var(--cyan-dim); }
  .block ul li b{ color:var(--text); font-weight:600; }

  .spec-grid{ display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--line-strong); border:1px solid var(--line-strong); margin-bottom:12px; }
  .spec-cell{ background:var(--panel-2); padding:14px 16px; }
  .spec-cell .k{ font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--text-faint); letter-spacing:.1em; text-transform:uppercase; margin-bottom:5px;}
  .spec-cell .v{ font-size:13.5px; color:var(--text); line-height:1.5; }

  .try-panel{
    background:var(--panel-2); border:1px solid var(--line-strong); border-left:3px solid var(--amber);
    padding:20px 22px; margin-bottom:12px;
  }
  .try-panel .lbl{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--amber); letter-spacing:.12em; margin-bottom:10px; text-transform:uppercase;}
  .try-panel .prompt{
    font-family:'IBM Plex Mono',monospace; font-size:13px; color:#d7dde3; background:#0a0e13;
    padding:14px 16px; border:1px solid var(--line); line-height:1.6; white-space:pre-wrap;
  }

  .callout{
    background:rgba(94,200,224,0.06); border:1px solid var(--line-strong);
    padding:16px 20px; font-size:13.5px; color:#c9d1d9; line-height:1.65; margin-bottom:12px;
  }
  .callout .lbl{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--cyan); letter-spacing:.12em; margin-bottom:6px; text-transform:uppercase; }
  .callout a{ text-decoration:underline; }

  .quiz{ background:var(--panel-2); border:1px solid var(--line-strong); padding:22px; }
  .quiz .q{ font-size:14.5px; font-weight:600; margin-bottom:14px; color:var(--text); }
  .quiz .opts{ display:flex; flex-direction:column; gap:8px; }
  .quiz-opt{
    text-align:left; background:#0a0e13; border:1px solid var(--line-strong); color:#c9d1d9;
    padding:11px 14px; font-size:13.5px; cursor:pointer; font-family:'Inter',sans-serif; border-radius:2px;
    transition:all .15s;
  }
  .quiz-opt:hover{ border-color:var(--cyan); }
  .quiz-opt.correct{ border-color:var(--done); background:rgba(88,214,141,0.1); color:var(--done); }
  .quiz-opt.wrong{ border-color:var(--amber); background:rgba(232,67,46,0.1); color:#ff8a7a; }
  .quiz-feedback{ margin-top:12px; font-size:13px; color:var(--text-mute); display:none; line-height:1.6; }

  .footer-nav{
    display:flex; justify-content:space-between; align-items:center; margin-top:40px;
    padding-top:24px; border-top:1px solid var(--line-strong);
  }
  .footer-nav .side{ display:flex; flex-direction:column; gap:4px; }
  .footer-nav .side.right{ align-items:flex-end; text-align:right; }
  .footer-nav .lbl{ font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--text-faint); letter-spacing:.1em; text-transform:uppercase;}
  .footer-nav .name{ font-size:14px; font-weight:600; color:var(--text); cursor:pointer; }
  .footer-nav .name:hover{ color:var(--cyan); }

  .intro-screen{ max-width:900px; }
  .intro-hero{
    border:1px solid var(--line-strong); background:var(--panel-2); padding:44px; margin-bottom:34px; position:relative; overflow:hidden;
  }
  .intro-hero::before{
    content:''; position:absolute; top:-40%; right:-10%; width:420px; height:420px; border-radius:50%;
    background:radial-gradient(circle, rgba(94,200,224,0.12) 0%, transparent 70%);
  }
  .intro-hero .eyebrow{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--amber); letter-spacing:.16em; margin-bottom:14px;}
  .intro-hero h2{ font-family:'Oswald',sans-serif; font-size:46px; text-transform:uppercase; line-height:1.02; margin-bottom:16px; }
  .intro-hero p{ font-size:16px; color:var(--text-mute); line-height:1.7; max-width:600px; margin-bottom:26px; }

  .stat-strip{ display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--line-strong); border:1px solid var(--line-strong); margin-bottom:34px; }
  .stat{ background:var(--panel-2); padding:20px; }
  .stat .n{ font-family:'IBM Plex Mono',monospace; font-size:28px; color:var(--cyan); font-weight:600; }
  .stat .l{ font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.08em; margin-top:4px; }

  .track-list{ display:flex; flex-direction:column; gap:1px; background:var(--line-strong); border:1px solid var(--line-strong); }
  .track-row{ background:var(--panel-2); padding:16px 20px; display:flex; align-items:center; gap:18px; cursor:pointer; transition:background .15s; }
  .track-row:hover{ background:#182028; }
  .track-row .tn{ font-family:'IBM Plex Mono',monospace; color:var(--text-faint); font-size:13px; width:24px; }
  .track-row .tt{ flex:1; font-size:14.5px; font-weight:600; }
  .track-row .td{ font-size:13px; color:var(--text-mute); flex:2; }
  .track-row .tm{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--text-faint); }

  @media (max-width:900px){
    .shell{ flex-direction:column; }
    .sidebar{ width:100%; height:auto; position:relative; }
    .content{ padding:32px 20px 80px; }
    .topbar{ padding:14px 20px; }
    .lesson-header h2{ font-size:30px; }
    .intro-hero h2{ font-size:32px; }
    .spec-grid, .stat-strip{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>

<div class="shell">

  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar">
    <div class="brand">
      <div class="eyebrow">TRANSMISSION // ANTHROPIC</div>
      <h1>The Claude<br>Operator's Course</h1>
      <p>Go from chatting with AI — to running it. 15 lessons, ~3h 10m total.</p>
    </div>

    <div class="gauge-wrap">
      <div class="gauge">
        <svg width="104" height="104" viewBox="0 0 104 104">
          <circle class="gauge-track" cx="52" cy="52" r="44" stroke-dasharray="207 276"/>
          <circle class="gauge-redline" cx="52" cy="52" r="44" stroke-dasharray="18 265" stroke-dashoffset="-189"/>
          <circle id="gaugeFill" class="gauge-fill" cx="52" cy="52" r="44" stroke-dasharray="0 276"/>
        </svg>
        <div class="gauge-center">
          <div class="gauge-num" id="gaugeNum">0%</div>
          <div class="gauge-lbl">complete</div>
        </div>
      </div>
      <div class="gauge-meta">
        Lessons done<br><b id="doneCount">0</b> / 15<br>
        <span style="color:var(--text-faint)">Time logged</span><br><b id="timeCount">0</b> min
      </div>
    </div>

    <nav class="lesson-nav" id="lessonNav">
      <div class="nav-section-lbl">Course Map</div>
      <!-- injected -->
    </nav>
  </aside>

  <!-- ============ MAIN ============ -->
  <main class="main">
    <div class="topbar">
      <div class="path">MODULE // <b id="topPath">00 · Start</b></div>
      <div class="actions">
        <button class="btn" onclick="goIntro()">Course overview</button>
        <button class="btn primary" id="markBtn" onclick="toggleComplete()">Mark lesson complete</button>
      </div>
    </div>
    <div class="content" id="content">
      <!-- injected -->
    </div>
  </main>

</div>

<script>
/* =========================================================
   DATA — 15 lessons
   ========================================================= */
const LESSONS = [
{
  title:"Meet Claude", time:10, tag:"FUNDAMENTALS",
  sub:"What Claude actually is, which model to reach for, and how a conversation is structured — the baseline every later lesson assumes you have.",
  meta:["Model family","No prerequisites","Applies to: claude.ai, app, API"],
  blocks:[
    {h:"What you're operating", p:"Claude is a family of AI models built by Anthropic that you talk to in plain language and that can read, write, reason over, and act on your behalf. You reach it through claude.ai, the mobile and desktop apps, the Claude API, and agentic tools like Claude Code and Claude Cowork.", list:[
      "<b>Claude Opus 4.8</b> — the deepest reasoning, best for the hardest, highest-stakes problems.",
      "<b>Claude Sonnet 5</b> — the balanced default: strong reasoning at everyday speed and cost.",
      "<b>Claude Haiku 4.5</b> — built for speed and volume, ideal for simple or high-throughput tasks.",
      "<b>Claude Fable 5</b> — Anthropic's Mythos-tier model with additional safety measures for biology, cybersecurity, and LLM research."
    ]},
    {h:"How a conversation works", p:"Every message you send becomes part of a growing context window — Claude re-reads the whole conversation each time it replies, which is why it can follow a thread across many turns but also why very long chats eventually need a fresh start or a Project (Lesson 3)."},
  ],
  spec:[["Cost of switching models","Free — pick per conversation, per task"],["Best first habit","State the outcome you want, not just the topic"]],
  try:"Open a new chat and ask Claude to explain, in two different ways, the same technical concept — once for a five-year-old and once for a peer engineer. Notice how much the framing of your request shapes the output.",
  callout:"Model names and availability change over time — if you're ever unsure which models you can access, ask Claude directly; it can check current documentation for you.",
  quiz:{q:"You need to triage 500 support tickets quickly and cheaply. Which model class fits best?", opts:["Opus 4.8, for maximum reasoning depth","Haiku 4.5, built for speed and volume","Fable 5, for extra safety review"], correct:1, fb:"Haiku-class models are built for fast, high-throughput tasks like bulk classification — save the heavier reasoning models for genuinely hard problems."}
},
{
  title:"Prompting for Claude", time:15, tag:"FUNDAMENTALS",
  sub:"The gap between a mediocre answer and a great one is almost always in the instruction, not the model. This lesson is the highest-leverage 15 minutes in the course.",
  meta:["Builds on: Lesson 1","Core skill","Applies everywhere"],
  blocks:[
    {h:"Five habits that change output quality", list:[
      "<b>Be explicit about the outcome.</b> \"Improve this\" is weaker than \"Rewrite this for a non-technical executive, under 200 words, ending with a clear recommendation.\"",
      "<b>Give examples.</b> One good example of the input/output pattern you want does more work than a paragraph of description.",
      "<b>Ask for step-by-step reasoning</b> on anything with real logic or stakes — it catches errors before they reach the answer.",
      "<b>Use structure</b> like XML tags (&lt;context&gt;, &lt;task&gt;, &lt;format&gt;) to separate background from instructions on longer, multi-part prompts.",
      "<b>Specify format up front</b> — length, tone, whether you want a table, bullets, or prose — so you're not rewriting after the fact."
    ]},
    {h:"Iterate like an engineer", p:"Treat your first prompt as a draft. If the output misses the mark, tell Claude specifically what was wrong rather than starting over — \"too long\" or \"wrong audience\" is enough for Claude to correct course in the same thread."}
  ],
  spec:[["Reference","docs.claude.com — prompt engineering overview"],["Anti-pattern","Vague requests + no examples + no format spec"]],
  try:"Take a task you've asked Claude to do before with mixed results. Rewrite the request with: (1) the specific outcome, (2) one example, (3) a format spec. Compare the two outputs side by side.",
  callout:"For anything genuinely complex or with high stakes, explicitly asking Claude to reason step-by-step before answering measurably improves accuracy.",
  quiz:{q:"Which addition most reliably improves output on a genuinely ambiguous task?", opts:["Making the prompt longer overall","Adding one concrete example of the input/output you want","Asking Claude to be 'more creative'"], correct:1, fb:"A single well-chosen example anchors the pattern far more effectively than extra description or vague adjectives."}
},
{
  title:"Working With Projects", time:10, tag:"WORKSPACE",
  sub:"Projects give Claude durable context — instructions, files, and knowledge that persist across every conversation inside them, so you stop re-explaining yourself.",
  meta:["claude.ai feature","Great for: recurring work","Team & solo use"],
  blocks:[
    {h:"What a Project actually solves", p:"A single chat forgets everything once you close it. A Project is a standing workspace: you set custom instructions once (your role, your brand voice, your standards) and upload reference files once, and every new conversation inside that Project starts already knowing them."},
    {h:"Good candidates for a Project", list:[
      "A recurring role — e.g. drafting client communications in a consistent voice.",
      "A body of reference material you query repeatedly — policies, specs, a style guide.",
      "A team standard — shared instructions so everyone's output stays consistent."
    ]}
  ],
  spec:[["Where it lives","claude.ai sidebar → Projects"],["Persists","Instructions + uploaded knowledge, across all chats in the Project"]],
  try:"Create a Project for one recurring task in your work — set custom instructions describing the audience, tone, and format you always need, then start a fresh chat inside it and see how much less you have to explain.",
  callout:"Projects are the difference between 'a chatbot that resets' and 'a colleague who already knows the brief.'",
  quiz:{q:"What's the main advantage of a Project over a single long chat?", opts:["It's faster to respond","Instructions and files persist across every new conversation in it","It uses a more powerful model automatically"], correct:1, fb:"Projects exist specifically so you don't have to re-establish context every time you start a new conversation."}
},
{
  title:"Research & Reasoning Modes", time:15, tag:"WORKSPACE",
  sub:"Not every question deserves the same amount of thought. This lesson is about picking the right depth — web search, deep research, and extended reasoning — for the task in front of you.",
  meta:["Builds on: Lesson 2","Controls: effort & depth"],
  blocks:[
    {h:"Three depths, three jobs", list:[
      "<b>Direct answer.</b> Claude answers from what it already knows — fastest, right for stable facts and explanations.",
      "<b>Web search.</b> Claude searches the live web when the answer depends on current information — prices, news, current role-holders, recent releases.",
      "<b>Deep research / extended thinking.</b> For open-ended or multi-source questions, Claude can run many searches and reason at length before answering — slower, but built for genuinely hard or broad problems."
    ]},
    {h:"Effort control", p:"Claude.ai and Claude Cowork also expose a direct effort control alongside the model selector, letting you choose how much work Claude puts into a single response — useful when you know a task is either trivially easy or unusually hard."}
  ],
  spec:[["Rule of thumb","If the answer could have changed since training, or spans many sources, ask for research"],["Cost of over-researching","Slower answers for questions that didn't need it"]],
  try:"Ask Claude something that requires current information (e.g. \"what happened in [your industry] this week\") and watch it search rather than guess from memory.",
  callout:"You don't need to say 'please search the web' for most current-events questions — Claude recognizes when a question needs fresh information and searches on its own.",
  quiz:{q:"A question about a well-established historical fact — which mode is most appropriate?", opts:["Deep research with many searches","A direct answer from what Claude already knows","Maximum effort setting"], correct:1, fb:"Stable, well-known facts don't benefit from research overhead — save deep research for current, contested, or multi-source questions."}
},
{

/* =========================================================
   STATE + RENDER
   ========================================================= */
const state = { current: -1, completed: new Set(), timeLogged: 0 };

function buildNav(){
  const nav = document.getElementById('lessonNav');
  LESSONS.forEach((l, i)=>{
    const row = document.createElement('div');
    row.className = 'lesson-item';
    row.id = 'nav-'+i;
    row.onclick = ()=>goLesson(i);
    row.innerHTML = `
      <div class="lesson-num mono">${String(i+1).padStart(2,'0')}</div>
      <div class="lesson-check" id="chk-${i}"></div>
      <div class="lesson-info">
        <div class="lesson-title">${l.title}</div>
        <div class="lesson-time mono">${l.time} min · ${l.tag}</div>
      </div>`;
    nav.appendChild(row);
  });
}

function updateGauge(){
  const total = LESSONS.length;
  const done = state.completed.size;
  const pct = Math.round((done/total)*100);
  const circumference = 276; // 2*PI*44
  const fillLen = (pct/100) * circumference;
  document.getElementById('gaugeFill').setAttribute('stroke-dasharray', `${fillLen} ${circumference}`);
  document.getElementById('gaugeNum').textContent = pct+'%';
  document.getElementById('doneCount').textContent = done;
  document.getElementById('timeCount').textContent = state.timeLogged;
  const fill = document.getElementById('gaugeFill');
  fill.style.stroke = pct >= 65 ? 'var(--amber)' : 'var(--cyan)';
}

function renderIntro(){
  state.current = -1;
  document.getElementById('topPath').textContent = '00 · Overview';
  highlightNav(-1);
  const done = state.completed.size;
  const totalMin = LESSONS.reduce((s,l)=>s+l.time,0);
  const html = `
    <div class="intro-screen">
      <div class="intro-hero">
        <div class="eyebrow">FULL CLAUDE COURSE</div>
        <h2>Go From Chatting<br>With AI — To Running It</h2>
        <p>Fifteen short modules, each one a single working session. Start anywhere, but the order below builds deliberately: fundamentals, then workspace tools, then agentic builders, then two applied case studies that tie it all together.</p>
        <button class="btn primary" onclick="goLesson(${done<15?state.completed.size:0})" style="padding:12px 24px;font-size:13px;">
          ${done>0 ? 'Resume course →' : 'Start Lesson 01 →'}
        </button>
      </div>

      <div class="stat-strip">
        <div class="stat"><div class="n mono">15</div><div class="l">Lessons</div></div>
        <div class="stat"><div class="n mono">${totalMin}</div><div class="l">Minutes total</div></div>
        <div class="stat"><div class="n mono">${done}</div><div class="l">Completed</div></div>
        <div class="stat"><div class="n mono">4</div><div class="l">Course tracks</div></div>
      </div>

      <div class="block"><h3>Track 01 — Fundamentals</h3></div>
      <div class="track-list" style="margin-bottom:26px;">
        ${trackRows(0,2)}
      </div>
      <div class="block"><h3>Track 02 — Workspace Tools</h3></div>
      <div class="track-list" style="margin-bottom:26px;">
        ${trackRows(2,9)}
      </div>
      <div class="block"><h3>Track 03 — Agentic Builders</h3></div>
      <div class="track-list" style="margin-bottom:26px;">
        ${trackRows(9,13)}
      </div>
      <div class="block"><h3>Track 04 — Applied Case Studies</h3></div>
      <div class="track-list">
        ${trackRows(13,15)}
      </div>
    </div>`;
  document.getElementById('content').innerHTML = html;
  document.getElementById('markBtn').style.display = 'none';
}

function trackRows(start,end){
  let out = '';
  for(let i=start;i<end;i++){
    const l = LESSONS[i];
    out += `<div class="track-row" onclick="goLesson(${i})">
      <div class="tn mono">${String(i+1).padStart(2,'0')}</div>
      <div class="tt">${l.title} ${state.completed.has(i)?'<span style="color:var(--done);font-size:11px;">✓</span>':''}</div>
      <div class="td">${l.sub.split('.')[0]}.</div>
      <div class="tm mono">${l.time}m</div>
    </div>`;
  }
  return out;
}

function renderLesson(i){
  state.current = i;
  const l = LESSONS[i];
  document.getElementById('topPath').textContent = String(i+1).padStart(2,'0')+' · '+l.title;
  highlightNav(i);
  document.getElementById('markBtn').style.display = 'inline-block';

  let blocksHtml = l.blocks.map(b=>`
    <div class="block">
      <h3>${b.h}</h3>
      ${b.p ? `<p>${b.p}</p>` : ''}
      ${b.list ? `<ul>${b.list.map(li=>`<li>${li}</li>`).join('')}</ul>` : ''}
    </div>`).join('');

  const specHtml = l.spec ? `
    <div class="block"><h3>Spec Sheet</h3>
      <div class="spec-grid">
        ${l.spec.map(([k,v])=>`<div class="spec-cell"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('')}
      </div>
    </div>` : '';

  const tryHtml = l.try ? `
    <div class="block"><h3>Try It Now</h3>
      <div class="try-panel">
        <div class="lbl">Practice prompt</div>
        <div class="prompt">${l.try}</div>
      </div>
    </div>` : '';

  const calloutHtml = l.callout ? `
    <div class="block">
      <div class="callout"><div class="lbl">Field Note</div>${l.callout}</div>
    </div>` : '';

  const quizHtml = l.quiz ? `
    <div class="block"><h3>Checkpoint</h3>
      <div class="quiz">
        <div class="q">${l.quiz.q}</div>
        <div class="opts">
          ${l.quiz.opts.map((o,oi)=>`<button class="quiz-opt" onclick="answerQuiz(this, ${oi===l.quiz.correct})">${o}</button>`).join('')}
        </div>
        <div class="quiz-feedback" id="quizFb">${l.quiz.fb}</div>
      </div>
    </div>` : '';

  const prev = i>0 ? LESSONS[i-1] : null;
  const next = i<LESSONS.length-1 ? LESSONS[i+1] : null;
  const footerHtml = `
    <div class="footer-nav">
      <div class="side">${prev ? `<div class="lbl">← Previous</div><div class="name" onclick="goLesson(${i-1})">${prev.title}</div>` : `<div class="lbl">Start</div>`}</div>
      <div class="side right">${next ? `<div class="lbl">Next →</div><div class="name" onclick="goLesson(${i+1})">${next.title}</div>` : `<div class="lbl">Course complete</div><div class="name" onclick="goIntro()">Back to overview</div>`}</div>
    </div>`;

  document.getElementById('content').innerHTML = `
    <div class="lesson-header">
      <div class="tag"><span class="num mono">${String(i+1).padStart(2,'0')}</span> LESSON ${i+1} OF ${LESSONS.length} · ${l.tag}</div>
      <h2>${l.title}</h2>
      <p class="sub">${l.sub}</p>
      <div class="meta-row">
        <div class="meta-chip"><span class="dot"></span>${l.time} min</div>
        ${l.meta.map(m=>`<div class="meta-chip"><span class="dot"></span>${m}</div>`).join('')}
      </div>
    </div>
    ${blocksHtml}
    ${specHtml}
    ${tryHtml}
    ${calloutHtml}
    ${quizHtml}
    ${footerHtml}
  `;
  updateMarkBtn();
  window.scrollTo({top:0, behavior:'instant'});
}

function answerQuiz(btn, isCorrect){
  const opts = btn.parentElement.querySelectorAll('.quiz-opt');
  opts.forEach(o=>o.onclick=null);
  opts.forEach(o=>o.style.cursor='default');
  if(isCorrect){
    btn.classList.add('correct');
  } else {
    btn.classList.add('wrong');
    const correctBtn = [...opts].find((o,idx)=> idx === LESSONS[state.current].quiz.correct);
    if(correctBtn) correctBtn.classList.add('correct');
  }
  document.getElementById('quizFb').style.display = 'block';
}

function highlightNav(i){
  document.querySelectorAll('.lesson-item').forEach(el=>el.classList.remove('active'));
  if(i>=0) document.getElementById('nav-'+i).classList.add('active');
}

function goLesson(i){ renderLesson(i); }
function goIntro(){ renderIntro(); }

function toggleComplete(){
  const i = state.current;
  if(i<0) return;
  const chk = document.getElementById('chk-'+i);
  if(state.completed.has(i)){
    state.completed.delete(i);
    chk.classList.remove('checked');
    state.timeLogged = Math.max(0, state.timeLogged - LESSONS[i].time);
  } else {
    state.completed.add(i);
    chk.classList.add('checked');
    state.timeLogged += LESSONS[i].time;
  }
  updateGauge();
  updateMarkBtn();
}

function updateMarkBtn(){
  const btn = document.getElementById('markBtn');
  const i = state.current;
  if(i<0) return;
  if(state.completed.has(i)){
    btn.textContent = '✓ Lesson complete';
    btn.classList.add('done-state');
  } else {
    btn.textContent = 'Mark lesson complete';
    btn.classList.remove('done-state');
  }
}

/* init */
buildNav();
updateGauge();
renderIntro();
</script>
</body>
</html>
